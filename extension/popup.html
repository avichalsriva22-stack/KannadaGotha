<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: 'Segoe UI', sans-serif; width: 250px; padding: 15px; background: #121212; color: white; }
    h2 { font-size: 16px; margin-top: 0; color: #4CAF50; }
    button { 
      width: 100%; padding: 10px; margin-bottom: 10px; border: none; border-radius: 5px; 
      font-weight: bold; cursor: pointer; transition: 0.3s;
    }
    #startBtn { background: #4CAF50; color: white; }
    #startBtn:hover { background: #45a049; }
    #stopBtn { background: #f44336; color: white; }
    #stopBtn:hover { background: #da190b; }
    .status { font-size: 12px; color: #aaa; text-align: center; }
  </style>
</head>
<body>
  <h2>Kannada Captions 🎧</h2>
  <button id="startBtn">Start Captioning</button>
  <button id="stopBtn" style="display:none;">Stop Captioning</button>
  <div id="status" class="status">Disconnected</div>
  <script src="popup.js"></script>
</body>
</html>
